# .github/workflows/ci-build-push.yaml
# Reusable workflow: build and push image
name: Reusable CI - Build and Push

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Service name to build (e.g., product, cart, ...)"
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -pl ${{ inputs.service_name }} -am
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service_name }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/yas-k3s-${{ inputs.service_name }}:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKER_USER }}/yas-k3s-${{ inputs.service_name }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USER }}/yas-k3s-${{ inputs.service_name }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USER }}/yas-k3s-${{ inputs.service_name }}:buildcache,mode=max

      - name: Print image info
        run: |
          echo "Image pushed successfully"
          echo "Image: ${{ secrets.DOCKER_USER }}/yas-k3s-${{ inputs.service_name }}:${{ steps.vars.outputs.sha_short }}"
          echo "Commit SHA: ${{ steps.vars.outputs.sha_short }}"
