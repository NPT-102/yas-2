# .github/workflows/ci-webhook.yaml
name: CI - Webhook Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'webhook/**'
      - '!webhook/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: webhook
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
