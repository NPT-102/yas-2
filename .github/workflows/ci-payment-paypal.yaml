# .github/workflows/ci-payment-paypal.yaml
name: CI - Payment Paypal Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'payment-paypal/**'
      - '!payment-paypal/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: payment-paypal
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
