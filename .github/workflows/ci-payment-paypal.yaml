# .github/workflows/ci-payment-paypal.yaml
name: CI - Payment Paypal Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'payment-paypal/**'
      - '!payment-paypal/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: payment-paypal
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
