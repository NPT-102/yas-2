# .github/workflows/ci-search.yaml
name: CI - Search Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'search/**'
      - '!search/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: search
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
