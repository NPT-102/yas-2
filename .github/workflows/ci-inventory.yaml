# .github/workflows/ci-inventory.yaml
name: CI - Inventory Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'inventory/**'
      - '!inventory/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: inventory
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
