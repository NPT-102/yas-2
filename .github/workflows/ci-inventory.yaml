# .github/workflows/ci-inventory.yaml
name: CI - Inventory Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'inventory/**'
      - '!inventory/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: inventory
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
