name: Release Staging on Tag

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-staging-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-java:
    name: Build Java Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release tag format
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build all services
        shell: bash
        run: |
          mvn -T 1C clean package -DskipTests \
            -pl product,cart,customer,backoffice-bff,inventory,location,media,order,payment,payment-paypal,promotion,rating,recommendation,sampledata,search,storefront-bff,tax,webhook \
            -am

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-artifacts
          path: |
            product/target/*.jar
            cart/target/*.jar
            customer/target/*.jar
            backoffice-bff/target/*.jar
            inventory/target/*.jar
            location/target/*.jar
            media/target/*.jar
            order/target/*.jar
            payment/target/*.jar
            payment-paypal/target/*.jar
            promotion/target/*.jar
            rating/target/*.jar
            recommendation/target/*.jar
            sampledata/target/*.jar
            search/target/*.jar
            storefront-bff/target/*.jar
            tax/target/*.jar
            webhook/target/*.jar

  build-and-push-images:
    name: Build & Push Docker Images
    needs: build-java
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - product
          - cart
          - customer
          - backoffice-bff
          - inventory
          - location
          - media
          - order
          - payment
          - payment-paypal
          - promotion
          - rating
          - recommendation
          - sampledata
          - search
          - storefront-bff
          - tax
          - webhook
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: java-artifacts
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get release tag
        id: vars
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.DOCKER_USER }}/yas-k3s-${{ matrix.service }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-staging-values:
    name: Update Staging Config
    needs: build-and-push-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release tag
        id: vars
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Update staging values with new tag
        uses: mikefarah/yq@v4.44.3
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        with:
          cmd: |
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/product/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/cart/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/customer/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/backoffice-bff/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/inventory/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/location/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/media/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/order/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/payment/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/payment-paypal/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/promotion/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/rating/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/recommendation/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/sampledata/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/search/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/storefront-bff/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/tax/values-staging.yaml
            yq -i '.backend.image.tag = strenv(TAG)' infra/k8s/charts/webhook/values-staging.yaml

      - name: Commit and push changes
        shell: bash
        run: |
          changed=$(git status --porcelain -- infra/k8s/charts/*/values-staging.yaml)
          if [[ -z "$changed" ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/charts/*/values-staging.yaml
          git commit -m "chore: release ${{ steps.vars.outputs.tag }} to staging"
          git pull --rebase origin main
          git push origin HEAD:main
