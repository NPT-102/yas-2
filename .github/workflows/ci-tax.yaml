# .github/workflows/ci-tax.yaml
name: CI - Tax Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'tax/**'
      - '!tax/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: tax
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
