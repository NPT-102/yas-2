# .github/workflows/cd-developer-build.yaml
name: CD - Developer Build

on:
  workflow_dispatch:
    inputs:
      developer_name:
        description: 'Developer name'
        required: true
        default: 'dev1'
      product_branch:
        required: false
        default: 'main'
      cart_branch:
        required: false
        default: 'main'
      customer_branch:
        required: false
        default: 'main'
      backoffice_bff_branch:
        required: false
        default: 'main'
      inventory_branch:
        required: false
        default: 'main'
      location_branch:
        required: false
        default: 'main'
      media_branch:
        required: false
        default: 'main'
      order_branch:
        required: false
        default: 'main'
      payment_branch:
        required: false
        default: 'main'
      payment_paypal_branch:
        required: false
        default: 'main'
      promotion_branch:
        required: false
        default: 'main'
      rating_branch:
        required: false
        default: 'main'
      recommendation_branch:
        required: false
        default: 'main'
      sampledata_branch:
        required: false
        default: 'main'
      search_branch:
        required: false
        default: 'main'
      storefront_bff_branch:
        required: false
        default: 'main'
      tax_branch:
        required: false
        default: 'main'
      webhook_branch:
        required: false
        default: 'main'

env:
  NAMESPACE: 'dev-${{ github.event.inputs.developer_name }}'

jobs:
  setup-namespace:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

  deploy-infrastructure:
    needs: setup-namespace
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy infrastructure
        run: |
          helm repo update
          helm dependency build --skip-refresh ./k8s/charts/yas-configuration
          helm upgrade --install yas-infra ./k8s/charts/yas-configuration \
            --namespace ${{ env.NAMESPACE }} \
            --set global.namespace=${{ env.NAMESPACE }} \
            --wait --timeout=180s

  deploy-core-services:
    needs: deploy-infrastructure
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-build chart dependencies
        run: |
          # Service charts use local file:// backend dep - no repo update needed
          # Build all 18 in parallel to save ~3 min
          PIDS=()
          for svc in product cart customer backoffice-bff inventory location media order \
                     payment payment-paypal promotion rating recommendation sampledata \
                     search storefront-bff tax webhook; do
            helm dependency build --skip-refresh ./k8s/charts/$svc &
            PIDS+=($!)
          done
          for pid in "${PIDS[@]}"; do wait "$pid"; done
          echo "All chart dependencies built."

      - name: Resolve image tags and deploy all services
        env:
          REGISTRY: ${{ secrets.DOCKER_USER }}
        run: |
          get_tag() {
            local branch="$1"
            if [ "$branch" = "main" ]; then
              echo "latest"
              return
            fi
            local sha
            sha=$(git ls-remote origin "refs/heads/$branch" | cut -c1-7)
            if [ -z "$sha" ]; then
              echo "latest"
            else
              echo "$sha"
            fi
          }

          deploy_service() {
            local name="$1"
            local tag="$2"
            echo "Deploying $name with tag $tag..."
            helm upgrade --install "$name" "./k8s/charts/$name" \
              --namespace ${{ env.NAMESPACE }} \
              --set backend.image.repository=$REGISTRY/yas-k3s-$name \
              --set backend.image.tag="$tag" \
              --set backend.service.type=NodePort \
              --set backend.ingress.enabled=false \
              --set backend.serviceMonitor.enabled=false \
              --set backend.databaseConnectionUrl=jdbc:postgresql://postgresql.postgres:5432 \
              --set backend.livenessProbe.initialDelaySeconds=60 \
              --set backend.livenessProbe.failureThreshold=40 \
              --set backend.livenessProbe.httpGet.path=/actuator/health/liveness \
              --set backend.livenessProbe.httpGet.port=metric \
              --set backend.readinessProbe.initialDelaySeconds=60 \
              --set backend.readinessProbe.failureThreshold=40 \
              --set backend.readinessProbe.httpGet.path=/actuator/health/readiness \
              --set backend.readinessProbe.httpGet.port=metric
            # No --wait: all 18 services deploy fast, then we wait in parallel below
          }

          deploy_service "product"        "$(get_tag '${{ github.event.inputs.product_branch }}')"
          deploy_service "cart"           "$(get_tag '${{ github.event.inputs.cart_branch }}')"
          deploy_service "customer"       "$(get_tag '${{ github.event.inputs.customer_branch }}')"
          deploy_service "backoffice-bff" "$(get_tag '${{ github.event.inputs.backoffice_bff_branch }}')"
          deploy_service "inventory"      "$(get_tag '${{ github.event.inputs.inventory_branch }}')"
          deploy_service "location"       "$(get_tag '${{ github.event.inputs.location_branch }}')"
          deploy_service "media"          "$(get_tag '${{ github.event.inputs.media_branch }}')"
          deploy_service "order"          "$(get_tag '${{ github.event.inputs.order_branch }}')"
          deploy_service "payment"        "$(get_tag '${{ github.event.inputs.payment_branch }}')"
          deploy_service "payment-paypal" "$(get_tag '${{ github.event.inputs.payment_paypal_branch }}')"
          deploy_service "promotion"      "$(get_tag '${{ github.event.inputs.promotion_branch }}')"
          deploy_service "rating"         "$(get_tag '${{ github.event.inputs.rating_branch }}')"
          deploy_service "recommendation" "$(get_tag '${{ github.event.inputs.recommendation_branch }}')"
          deploy_service "sampledata"     "$(get_tag '${{ github.event.inputs.sampledata_branch }}')"
          deploy_service "search"         "$(get_tag '${{ github.event.inputs.search_branch }}')"
          deploy_service "storefront-bff" "$(get_tag '${{ github.event.inputs.storefront_bff_branch }}')"
          deploy_service "tax"            "$(get_tag '${{ github.event.inputs.tax_branch }}')"
          deploy_service "webhook"        "$(get_tag '${{ github.event.inputs.webhook_branch }}')"

      - name: Wait for all deployments (parallel)
        run: |
          # All 18 rollout checks run in parallel - total wait = slowest single service
          PIDS=()
          SVCS=(product cart customer backoffice-bff inventory location media order
                payment payment-paypal promotion rating recommendation sampledata
                search storefront-bff tax webhook)
          for svc in "${SVCS[@]}"; do
            kubectl rollout status "deployment/$svc" -n ${{ env.NAMESPACE }} --timeout=10m &
            PIDS+=($!)
          done
          FAILED=0
          for i in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$i]}"; then
              echo "::error::Rollout failed for deployment/${SVCS[$i]} in ${{ env.NAMESPACE }}"
              kubectl get pods -n ${{ env.NAMESPACE }} -l "app.kubernetes.io/name=${SVCS[$i]}" -o wide
              kubectl get events -n ${{ env.NAMESPACE }} --sort-by=.lastTimestamp | tail -20
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] || exit 1

      - name: Print service NodePort endpoints
        run: |
          WORKER_IP=$(kubectl get nodes -l '!node-role.kubernetes.io/control-plane' \
            -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || \
            kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          echo "================================================"
          echo " Developer namespace: ${{ env.NAMESPACE }}"
          echo " Worker node IP:      $WORKER_IP"
          echo " Add the following to your /etc/hosts file:"
          echo "   $WORKER_IP  <service>.${{ env.NAMESPACE }}.local"
          echo "================================================"
          echo "Service NodePort endpoints:"
          for svc in product cart customer backoffice-bff inventory location media order \
                     payment payment-paypal promotion rating recommendation sampledata \
                     search storefront-bff tax webhook; do
            PORT=$(kubectl get svc "$svc" -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo 'N/A')
            echo "  $svc  ->  $WORKER_IP:$PORT"
          done
          echo "================================================"
