# .github/workflows/cd-developer-build.yaml
name: CD - Developer Build

on:
  workflow_dispatch:
    inputs:
      developer_name:
        description: 'Developer name'
        required: true
        default: 'dev1'
      product_branch:
        required: false
        default: 'main'
      cart_branch:
        required: false
        default: 'main'
      customer_branch:
        required: false
        default: 'main'

env:
  NAMESPACE: 'dev-${{ github.event.inputs.developer_name }}'

jobs:
  setup-namespace:
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      #      # NOTE: Uncomment only if the runner is NOT on the same machine as Minikube.
      #      # For local self-hosted runners, keep this commented to use local config.
      #      - name: Configure kubeconfig
      #        run: |
      #          if (!(Test-Path "$HOME\.kube")) { New-Item -ItemType Directory -Path "$HOME\.kube" -Force }
      #          $bytes = [System.Convert]::FromBase64String("${{ secrets.KUBECONFIG_BASE64 }}")
      #          [System.IO.File]::WriteAllBytes("$HOME\.kube\config", $bytes)

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

  deploy-infrastructure:
    needs: setup-namespace
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy infrastructure
        run: |
          kubectl apply -f ./k8s/mini-infra.yaml --namespace ${{ env.NAMESPACE }}
          helm dependency build ./k8s/charts/yas-configuration
          helm upgrade --install yas-infra ./k8s/charts/yas-configuration --namespace ${{ env.NAMESPACE }} --set global.namespace=${{ env.NAMESPACE }} --wait --timeout=180s

  deploy-core-services:
    needs: deploy-infrastructure
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tags and deploy core services
        run: |
          $REGISTRY = "${{ secrets.DOCKERHUB_USERNAME }}"

          function Get-Tag($branch) {
              if ($branch -eq "main") { return "latest" }
              $remote = (git ls-remote origin "refs/heads/$branch")
              if ($null -eq $remote) { return "latest" }
              return $remote.Split("`t")[0].Substring(0,7)
          }

          # Deploy product
          $TAG_PRODUCT = Get-Tag "${{ github.event.inputs.product_branch }}"
          helm dependency build ./k8s/charts/product
          helm upgrade --install product ./k8s/charts/product --namespace ${{ env.NAMESPACE }} --set image.repository=$REGISTRY/yas-k3s-product --set image.tag=$TAG_PRODUCT --set service.type=NodePort --set backend.serviceMonitor.enabled=false --set backend.databaseConnectionUrl=jdbc:postgresql://postgresql.postgres:5432 --set backend.livenessProbe.initialDelaySeconds=120 --set backend.livenessProbe.failureThreshold=30 --set backend.livenessProbe.httpGet.path=/actuator/health/liveness --set backend.livenessProbe.httpGet.port=metric --set backend.readinessProbe.initialDelaySeconds=120 --set backend.readinessProbe.failureThreshold=30 --set backend.readinessProbe.httpGet.path=/actuator/health/readiness --set backend.readinessProbe.httpGet.port=metric --wait --timeout=5m

          # Deploy cart
          $TAG_CART = Get-Tag "${{ github.event.inputs.cart_branch }}"
          helm dependency build ./k8s/charts/cart
          helm upgrade --install cart ./k8s/charts/cart --namespace ${{ env.NAMESPACE }} --set image.repository=$REGISTRY/yas-k3s-cart --set image.tag=$TAG_CART --set service.type=NodePort --set backend.serviceMonitor.enabled=false --set backend.databaseConnectionUrl=jdbc:postgresql://postgresql.postgres:5432 --set backend.livenessProbe.initialDelaySeconds=120 --set backend.livenessProbe.failureThreshold=30 --set backend.livenessProbe.httpGet.path=/actuator/health/liveness --set backend.livenessProbe.httpGet.port=metric --set backend.readinessProbe.initialDelaySeconds=120 --set backend.readinessProbe.failureThreshold=30 --set backend.readinessProbe.httpGet.path=/actuator/health/readiness --set backend.readinessProbe.httpGet.port=metric --wait --timeout=5m

          # Deploy customer
          $TAG_CUSTOMER = Get-Tag "${{ github.event.inputs.customer_branch }}"
          helm dependency build ./k8s/charts/customer
          helm upgrade --install customer ./k8s/charts/customer --namespace ${{ env.NAMESPACE }} --set image.repository=$REGISTRY/yas-k3s-customer --set image.tag=$TAG_CUSTOMER --set service.type=NodePort --set backend.serviceMonitor.enabled=false --set backend.databaseConnectionUrl=jdbc:postgresql://postgresql.postgres:5432 --set backend.livenessProbe.initialDelaySeconds=120 --set backend.livenessProbe.failureThreshold=30 --set backend.livenessProbe.httpGet.path=/actuator/health/liveness --set backend.livenessProbe.httpGet.port=metric --set backend.readinessProbe.initialDelaySeconds=120 --set backend.readinessProbe.failureThreshold=30 --set backend.readinessProbe.httpGet.path=/actuator/health/readiness --set backend.readinessProbe.httpGet.port=metric --wait --timeout=5m

      - name: Verify deployment
        run: |
          $ErrorActionPreference = "Stop"

          function Test-Rollout {
            param([string]$DeploymentName)

            Write-Host "Verifying rollout for deployment/$DeploymentName in namespace ${{ env.NAMESPACE }}"
            kubectl rollout status "deployment/$DeploymentName" -n ${{ env.NAMESPACE }} --timeout=3m

            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Rollout failed for deployment/$DeploymentName in namespace ${{ env.NAMESPACE }}."
              Write-Host "---- Pods ----"
              kubectl get pods -n ${{ env.NAMESPACE }} -o wide
              Write-Host "---- Deployment Describe ----"
              kubectl describe "deployment/$DeploymentName" -n ${{ env.NAMESPACE }}
              Write-Host "---- Recent Events ----"
              kubectl get events -n ${{ env.NAMESPACE }} --sort-by=.lastTimestamp | Select-Object -Last 30
              exit 1
            }
          }

          Test-Rollout -DeploymentName "product"
          Test-Rollout -DeploymentName "cart"
          Test-Rollout -DeploymentName "customer"

      - name: Print access info
        run: |
          $NODE_IP = (kubectl get nodes -o jsonpath='{.items[0].status.addresses[0].address}')
          Write-Host "=========================================="
          Write-Host "Node IP: $NODE_IP"
          kubectl get svc -n ${{ env.NAMESPACE }}
          Write-Host "=========================================="
