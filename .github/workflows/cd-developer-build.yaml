# .github/workflows/cd-developer-build.yaml
name: CD - Developer Build

on:
  workflow_dispatch:
    inputs:
      developer_name:
        description: 'Developer name'
        required: true
        default: 'dev1'
      product_branch:
        required: false
        default: 'main'
      cart_branch:
        required: false
        default: 'main'
      customer_branch:
        required: false
        default: 'main'
      backoffice_bff_branch:
        required: false
        default: 'main'
      inventory_branch:
        required: false
        default: 'main'
      media_branch:
        required: false
        default: 'main'
      order_branch:
        required: false
        default: 'main'
      search_branch:
        required: false
        default: 'main'
      storefront_bff_branch:
        required: false
        default: 'main'
      tax_branch:
        required: false
        default: 'main'
      storefront_ui_branch:
        required: false
        default: 'main'
      backoffice_ui_branch:
        required: false
        default: 'main'

env:
  NAMESPACE: 'dev-${{ github.event.inputs.developer_name }}'
  REGISTRY: ${{ secrets.DOCKER_USER }}

jobs:

  setup-namespace:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

  deploy-infrastructure:
    needs: setup-namespace
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy infrastructure
        run: |
          helm repo update
          helm dependency build --skip-refresh ./infra/k8s/charts/yas-configuration
          helm upgrade --install yas-infra ./infra/k8s/charts/yas-configuration \
            --namespace ${{ env.NAMESPACE }} \
            --set global.namespace=${{ env.NAMESPACE }} \
            --wait --timeout=180s

  deploy-core-services:
    needs: deploy-infrastructure
    runs-on: self-hosted

    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-build chart dependencies
        run: |
          # Service charts use local file:// backend dep - no repo update needed
          # Build all 18 in parallel to save ~3 min
          PIDS=()
          for svc in product cart customer backoffice-bff inventory media order \
                     search storefront-bff tax storefront-ui backoffice-ui swagger-ui; do
            helm dependency build --skip-refresh ./infra/k8s/charts/$svc &
            PIDS+=($!)
          done
          for pid in "${PIDS[@]}"; do wait "$pid"; done
          echo "All chart dependencies built."

      - name: Resolve image tags and deploy all services
        env:
          REGISTRY: ${{ secrets.DOCKER_USER }}
        run: |
          get_tag() {
            local branch="$1"
            if [ "$branch" = "main" ]; then
              echo "latest"
              return
            fi
            local sha
            sha=$(git ls-remote origin "refs/heads/$branch" | cut -c1-7)
            if [ -z "$sha" ]; then
              echo "latest"
            else
              echo "$sha"
            fi
          }

          deploy_service() {
            local name="$1"
            local tag="$2"
            echo "Deploying $name with tag $tag..."
            helm upgrade --install "$name" "./infra/k8s/charts/$name" \
              --namespace ${{ env.NAMESPACE }} \
              --set backend.image.repository=$REGISTRY/yas-k3s-$name \
              --set backend.image.tag="$tag" \
              --set backend.service.type=NodePort \
              --set backend.ingress.enabled=false \
              --set backend.serviceMonitor.enabled=false \
              --set backend.databaseConnectionUrl=jdbc:postgresql://postgresql.postgres:5432
            # No --wait: all 18 services deploy fast, then we wait in parallel below
          }

          deploy_service "product"        "$(get_tag '${{ github.event.inputs.product_branch }}')"
          deploy_service "cart"           "$(get_tag '${{ github.event.inputs.cart_branch }}')"
          deploy_service "customer"       "$(get_tag '${{ github.event.inputs.customer_branch }}')"
          deploy_service "backoffice-bff" "$(get_tag '${{ github.event.inputs.backoffice_bff_branch }}')"
          deploy_service "inventory"      "$(get_tag '${{ github.event.inputs.inventory_branch }}')"
          deploy_service "media"          "$(get_tag '${{ github.event.inputs.media_branch }}')"
          deploy_service "order"          "$(get_tag '${{ github.event.inputs.order_branch }}')"
          deploy_service "search"         "$(get_tag '${{ github.event.inputs.search_branch }}')"
          deploy_service "storefront-bff" "$(get_tag '${{ github.event.inputs.storefront_bff_branch }}')"
          deploy_service "tax"            "$(get_tag '${{ github.event.inputs.tax_branch }}')"

          echo "Deploying UI services..."
          TAG_BO_UI=$(get_tag '${{ github.event.inputs.backoffice_ui_branch }}')
          helm upgrade --install "backoffice-ui" "./infra/k8s/charts/backoffice-ui" \
            --namespace ${{ env.NAMESPACE }} \
            --set ui.image.repository="${{ secrets.DOCKER_USER }}/yas-k3s-backoffice-ui" \
            --set ui.image.tag="$TAG_BO_UI" \
            --set ui.service.type=NodePort \
            --set ui.ingress.enabled=false \
            --set global.namespace=${{ env.NAMESPACE }}

          TAG_SF_UI=$(get_tag '${{ github.event.inputs.storefront_ui_branch }}')
          helm upgrade --install "storefront-ui" "./infra/k8s/charts/storefront-ui" \
            --namespace ${{ env.NAMESPACE }} \
            --set ui.image.repository="${{ secrets.DOCKER_USER }}/yas-k3s-storefront-ui" \
            --set ui.image.tag="$TAG_SF_UI" \
            --set ui.service.type=NodePort \
            --set ui.ingress.enabled=false \
            --set global.namespace=${{ env.NAMESPACE }}

          helm upgrade --install "swagger-ui" "./infra/k8s/charts/swagger-ui" \
            --namespace ${{ env.NAMESPACE }} \
            --set service.type=NodePort \
            --set ingress.enabled=false \
            --set apiIngress.enabled=false \
            --set global.namespace=${{ env.NAMESPACE }}

      - name: Wait for all deployments (parallel)
        run: |
          # wait_rollout: succeeds for app-level crashes (CrashLoopBackOff/Error/OOMKilled),
          # fails only for infra issues (stuck Pending, ImagePullBackOff, etc.)
          wait_rollout() {
            local svc=$1
            local ns=$2
            if kubectl rollout status "deployment/$svc" -n "$ns" --timeout=10m 2>&1; then
              return 0
            fi
            # Rollout failed/timed out — inspect pod state
            local pod_state
            pod_state=$(kubectl get pods -n "$ns" -l "app.kubernetes.io/name=$svc" \
              --no-headers 2>/dev/null | awk 'NR==1{print $3}')
            case "$pod_state" in
              CrashLoopBackOff|Error|OOMKilled|Completed)
                echo "::warning::$svc pod is '$pod_state' — app-level crash (not infra). Skipping, CD continues."
                kubectl logs -n "$ns" "deployment/$svc" --previous --tail=30 2>/dev/null || true
                return 0
                ;;
              "")
                echo "::error::Rollout failed for deployment/$svc in $ns — no pods found (infra issue)"
                kubectl describe deployment "$svc" -n "$ns" | tail -20
                return 1
                ;;
              *)
                echo "::error::Rollout failed for deployment/$svc in $ns (pod state: $pod_state)"
                kubectl get pods -n "$ns" -l "app.kubernetes.io/name=$svc" -o wide
                kubectl get events -n "$ns" --sort-by=.lastTimestamp | tail -20
                return 1
                ;;
            esac
          }

          # All 18 rollout checks run in parallel - total wait = slowest single service
          PIDS=()
          SVCS=(product cart customer backoffice-bff inventory media order
                search storefront-bff tax backoffice-ui storefront-ui swagger-ui)
          for svc in "${SVCS[@]}"; do
            wait_rollout "$svc" ${{ env.NAMESPACE }} &
            PIDS+=($!)
          done
          FAILED=0
          for i in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$i]}"; then
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] || exit 1

      - name: Print service NodePort endpoints
        run: |
          echo "================================================"
          echo " Developer namespace: ${{ env.NAMESPACE }}"
          echo "================================================"
          echo "Service NodePort endpoints (Dynamic Discovery):"
          for svc in product cart customer backoffice-bff inventory media order \
                     search storefront-bff tax backoffice-ui storefront-ui swagger-ui; do
            PORT=$(kubectl get svc "$svc" -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo 'N/A')
            
            # Find the node where the pod is actually scheduled
            NODE_NAME=$(kubectl get pods -n ${{ env.NAMESPACE }} -l "app.kubernetes.io/name=$svc" \
              -o jsonpath='{.items[0].spec.nodeName}' 2>/dev/null)
            
            if [ -n "$NODE_NAME" ]; then
              # Resolve the IP of that specific node
              NODE_IP=$(kubectl get node "$NODE_NAME" \
                -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || echo "Unknown")
            else
              NODE_IP="Pending/Unknown"
            fi
            
            echo "  $svc  ->  $NODE_IP:$PORT"
          done
          echo "================================================"
          echo "Note: If a service shows multiple nodes, any node IP + NodePort will work,"
          echo "but use the specific IP above if you have cross-node networking issues."
          echo "================================================"
