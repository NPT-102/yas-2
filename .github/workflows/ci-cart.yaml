# .github/workflows/ci-cart.yaml
name: CI - Cart Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'cart/**'
      - '!cart/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: cart
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
