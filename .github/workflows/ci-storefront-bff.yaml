# .github/workflows/ci-storefront-bff.yaml
name: CI - Storefront Bff Service

on:
  push:
    branches:
      - '**'
    paths:
      - 'storefront-bff/**'
      - '!storefront-bff/**.md'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/ci-build-push.yaml
    with:
      service_name: storefront-bff
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
