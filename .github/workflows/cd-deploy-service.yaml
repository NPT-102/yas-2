# .github/workflows/cd-deploy-service.yaml
name: Reusable CD - Deploy Service

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      namespace:
        required: true
        type: string
    secrets:
      DOCKER_USER:
        required: true
      KUBECONFIG_BASE64:
        required: true

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy service
        run: |
          helm dependency build ./k8s/charts/${{ inputs.service_name }}
          helm upgrade --install ${{ inputs.service_name }} ./k8s/charts/${{ inputs.service_name }} \
            --namespace ${{ inputs.namespace }} --create-namespace \
            --set image.repository=${{ secrets.DOCKER_USER }}/yas-k3s-${{ inputs.service_name }} \
            --set image.tag=${{ inputs.image_tag }} \
            --set service.type=NodePort \
            --set backend.serviceMonitor.enabled=false \
            --set backend.databaseConnectionUrl=jdbc:postgresql://postgresql.postgres:5432 \
            --set backend.livenessProbe.initialDelaySeconds=120 \
            --set backend.livenessProbe.failureThreshold=30 \
            --set backend.livenessProbe.httpGet.path=/actuator/health/liveness \
            --set backend.livenessProbe.httpGet.port=metric \
            --set backend.readinessProbe.initialDelaySeconds=120 \
            --set backend.readinessProbe.failureThreshold=30 \
            --set backend.readinessProbe.httpGet.path=/actuator/health/readiness \
            --set backend.readinessProbe.httpGet.port=metric \
            --wait --timeout=120s

      - name: Verify deployment
        run: |
          set -e
          kubectl rollout status "deployment/${{ inputs.service_name }}" \
            -n ${{ inputs.namespace }} --timeout=3m || {
            echo "::error::Rollout failed for deployment/${{ inputs.service_name }} in namespace ${{ inputs.namespace }}."
            kubectl get pods -n ${{ inputs.namespace }} -o wide
            kubectl describe "deployment/${{ inputs.service_name }}" -n ${{ inputs.namespace }}
            kubectl get events -n ${{ inputs.namespace }} --sort-by=.lastTimestamp | tail -30
            exit 1
          }
